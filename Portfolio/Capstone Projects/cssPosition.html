<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Css positioning</title>
		<style>
			.purpleDiv {
				width: 500px;
				height: 300px;
				background-color: blue;
				position: relative;
				top: 12vh;
				left: 12vw;
			}

			.redCircle {
				width: 200px;
				height: 200px;
				background-color: red;
				position: absolute;
				border-radius: 50%;
				top: 20%;
				left: 30%;
			}
		</style>
	</head>
	<body>
		<h4>This is a demonstration of a relative and absolute css positioning</h4>
		<div class="purpleDiv">
			<div class="redCircle"></div>
		</div>
	</body>
</html>
