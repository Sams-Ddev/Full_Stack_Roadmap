<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mondrian Project</title>
		<style>
			/* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E
    */
			.container {
				background-color: black;
				height: 100vh;
				display: grid;
				gap: 9px;
				grid-template-columns: 320px 198px 153px 50px;
				grid-template-rows: 414px 130px 155px 20px;
			}

			.redbox {
				background-color: red;
			}

			.secondbox {
				background-color: aliceblue;
				grid-column: span 3;
			}

			.thirdbox {
				background-color: aliceblue;
				grid-row: span 2;
			}

			.fourtbox {
				background-color: aliceblue;
				grid-column: span 2;
				grid-row: span 2;
			}

			.fifthbox {
				background-color: rgb(4, 4, 132);
			}
		</style>
	</head>

	<body>
		<!-- Lets create a Piere Modrian Masterpiece painting using grid -->
		<div class="container">
			<div class="redbox item"></div>
			<div class="secondbox item"></div>
			<div class="thirdbox item"></div>
			<div class="fourtbox item"></div>
			<div class="fifthbox item"></div>
			<div class="sixbox item"></div>
			<div class="sevenbox item"></div>
		</div>
	</body>
</html>
