<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Error Page</title>
		<style>
			body {
				align-items: center;
				background-color: #3267ff;
			}

			button {
				height: 30px;
				width: 110px;
				border-radius: 30px;
				background-color: rgb(176, 247, 247);
			}

			.indivBtn {
				width: 160px;
				height: 35px;
			}

			nav {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 20px;
			}

			.circle {
				background-color: rgb(176, 247, 247);
				width: 30px;
				height: 30px;
				border-radius: 50%;
			}

			code {
				font-family: "Courier New", Courier, monospace;
				font-size: medium;
			}
			.code {
				color: chocolate;
			}

			.circlecontainers {
				display: flex;
				gap: 9px;
				padding: 0px 5px;
				align-content: center;
			}

			side {
				display: flex;
				gap: 8px;
				flex-direction: column;
			}
		</style>
	</head>
	<body>
		<section class="container">
			<nav>
				<img
					src="/My_HTML/tryProjects/logo.png"
					alt="site logo"
					width="120px"
					height="30px"
				/>
				<button>Notify me</button>
			</nav>
			<div class="innerBox">
				<pre>
        <code> <span class="code">#titanic</span> { 
          float : <span class="code">none;</span> 
        } </code>
      </pre>
				<side>
					<button class="indivBtn">Buy Merch</button>
					<div class="circlecontainers">
						<div class="circle"></div>
						<div class="circle"></div>
						<div class="circle"></div>
						<div class="circle"></div>
					</div>
				</side>
			</div>
		</section>
	</body>
</html>
