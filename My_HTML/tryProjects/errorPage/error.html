<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Error Page</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Coral+Pixels&display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				width: 100%;
				min-height: 100%;
				text-align: center;
				background-color: #3267ff;
				color: aliceblue;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-content: center;
			}

			button {
				height: 30px;
				width: 110px;
				border-radius: 30px;
				background-color: rgb(176, 247, 247);
			}

			.indivBtn {
				width: 160px;
				height: 35px;
				background-color: #3267ff;
				color: white;
				border-color: #4b7afb;
			}

			nav {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 20px;
			}

			.heroImg {
				font-size: 100px;
				color: rgb(21, 18, 18);
				font-family: "Coral Pixels", serif;
				font-weight: 400;
				font-style: normal;
				margin-bottom: -50px;
			}

			.circle {
				background-color: #3267ff;
				width: 30px;
				height: 30px;
				border-radius: 50%;
			}

			code {
				font-family: "Courier New", Courier, monospace;
				font-weight: 600;
			}
			.code {
				color: chocolate;
			}

			.circlecontainers {
				display: flex;
				gap: 9px;
				padding: 0px 5px;
				align-content: center;
			}

			side {
				display: flex;
				gap: 8px;
				flex-direction: column;
			}

			.innerBox {
				background-color: rgba(12, 11, 11, 0.362);
				display: flex;
				justify-content: space-between;
				width: 60vw;
				margin-left: auto;
				margin-right: auto;
				padding: 50px 30px;
				border-radius: 6px;
				align-items: center;
			}

			.bottom {
				position: fixed;
				bottom: 15px;
				left: 25%;
				right: 25%;
				font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
					"Lucida Sans Unicode", Geneva, Verdana, sans-serif;
				font-size: 13px;
			}

			@media (max-width: 800px) {
				.innerBox {
					flex-direction: column;
				}
			}
		</style>
	</head>
	<body>
		<section class="container">
			<nav>
				<img
					src="/My_HTML/tryProjects/logo.png"
					alt="site logo"
					width="120px"
					height="30px"
				/>
				<a href="mailto:zee@outlook.com"><button>Notify me</button></a>
			</nav>
			<p class="heroImg">404</p>
			<div class="innerBox">
				<code>
					<span class="code">#titanic</span> { <br />
					float :
					<span class="code">none;</span> <br />
					}
				</code>
				<br />
				<side>
					<button class="indivBtn">Buy Merch</button>
					<div class="circlecontainers">
						<div class="circle"></div>
						<div class="circle"></div>
						<div class="circle"></div>
						<div class="circle"></div>
					</div>
				</side>
			</div>
		</section>
		<p class="bottom">
			Our tryProjects: ✔ E-commence ❄ Snowflakes ☦Church Management Platforms
		</p>
	</body>
</html>
